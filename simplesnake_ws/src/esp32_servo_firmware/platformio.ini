; ESP32-S3-N8R8 + micro-ROS (Jazzy) + ST3215 servo firmware
; -------------------------------------------------------------
; If PlatformIO fails to find/flash the board, you can hard-code
; the port here instead of relying on auto-detect:
;   upload_port = /dev/ttyACM0
;   monitor_port = /dev/ttyACM0

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- micro-ROS ---
board_microros_distro = jazzy
board_microros_transport = serial
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    https://github.com/workloads/scservo.git

; --- USB-serial bridge ---
; This board uses an external CH343 USB-UART bridge chip (shows up in
; `dmesg`/`lsusb` as idVendor=1a86) rather than the ESP32-S3's native
; USB peripheral, so `Serial` must stay mapped to the normal hardware
; UART0, not the native-USB CDC mode. If you ever swap to a board that
; DOES use native USB (idVendor 303a in dmesg), you'd flip these to 1
; instead.
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0

board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600