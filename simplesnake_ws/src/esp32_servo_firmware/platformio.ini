[env:esp32dev]                     ; was [env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32dev                   ; was esp32-s3-devkitc-1
framework = arduino

board_microros_distro = jazzy
board_microros_transport = serial
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    https://github.com/workloads/scservo.git

; --- REMOVE these two lines entirely ---
; ARDUINO_USB_MODE / ARDUINO_USB_CDC_ON_BOOT only exist on chips with a
; native USB peripheral (S2/S3/C3). Classic ESP32 has no USB OTG at all,
; so these flags are meaningless on esp32dev and can cause a build error.
;build_flags =
;    -D ARDUINO_USB_MODE=0
;    -D ARDUINO_USB_CDC_ON_BOOT=0

board_build.partitions = default.csv   ; unchanged, fine for 4MB flash
monitor_speed = 115200
upload_speed = 960000
upload_port = /dev/ttyUSB0             ; unchanged - confirm below
monitor_port = /dev/ttyUSB0