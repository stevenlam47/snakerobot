; ESP32-S3-N8R8 + micro-ROS (Jazzy) + ST3215 servo firmware
; -------------------------------------------------------------
; If PlatformIO fails to find/flash the board, you can hard-code
; the port here instead of relying on auto-detect:
;   upload_port = /dev/ttyACM0
;   monitor_port = /dev/ttyACM0

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- micro-ROS ---
board_microros_distro = jazzy
board_microros_transport = serial
upload_port = /dev/ttyACM0          # <-- force this
monitor_port = /dev/ttyACM0
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    https://github.com/workloads/scservo.git

; --- native USB CDC so the board enumerates as /dev/ttyACM0 ---
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
