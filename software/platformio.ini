; ESP32-WROOM-32 (FCC ID 2AC7Z-ESPWROOM32) + micro-ROS (Jazzy) + ST3215 servo firmware
; -------------------------------------------------------------
; If PlatformIO fails to find/flash the board, you can hard-code
; the port here instead of relying on auto-detect:
;   upload_port = /dev/ttyUSB0
;   monitor_port = /dev/ttyUSB0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; --- micro-ROS ---
board_microros_distro = jazzy
board_microros_transport = serial
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    https://github.com/workloads/scservo.git

; --- USB-serial bridge ---
; Classic ESP32 (WROOM-32) has no native USB peripheral, so there is no
; ARDUINO_USB_MODE / ARDUINO_USB_CDC_ON_BOOT to configure here - Serial
; always maps to hardware UART0, which goes out through the board's
; onboard USB-UART bridge chip (commonly CP2102 or CH340, shows up in
; `dmesg`/`lsusb` as idVendor=10c4 or 1a86).

board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
